name: Idea, need, use case or user story
description: Share an idea, need, use case or user story to help shape the Modeling App.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing. You don't need to be technical to contribute here, and every perspective helps us build a better Modeling App.

        Use this template to tell us about:
        - **An idea** for something new or improved
        - **A need** in your work that the app could help with
        - **A use case** — a real scenario where the app could add value
        - **A user story** — "As a [role], I want [capability], so that [benefit]"

        Share as much or as little as you like. Real examples from your context are the most valuable thing you can give us.

        This issue will be public, so please don't include personal or patient data.

  - type: input
    id: who
    attributes:
      label: Who are you?
      description: Optional. Your role, organisation and country help us understand the context.
      placeholder: e.g. HMIS officer, Ministry of Health, Country X
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: Your idea, need, use case or user story
      description: |
        Describe what you'd like to see, the need you have, the scenario you have in mind, or your user story.
        For user stories, a helpful format is: "As a [role], I want [capability], so that [benefit]".
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: What value would this bring?
      description: Who would benefit, and how would it improve their work or outcomes?
    validations:
      required: false

  - type: textarea
    id: today
    attributes:
      label: How is this handled today?
      description: Optional. Any current approach or workaround, if there is one.
    validations:
      required: false

  - type: textarea
    id: success
    attributes:
      label: What would success look like?
      description: Optional. How would you know this is working well?
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Ideas for how it could work
      description: Optional. Any thoughts on an approach are welcome, but not required.
    validations:
      required: false

  - type: textarea
    id: links
    attributes:
      label: Links, data or examples
      description: Optional. Screenshots, documents or links that bring the idea to life.
    validations:
      required: false

