name: deploy-modeling-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an upload before starting the next deployment.
concurrency:
  group: deploy-modeling-app
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual runs and retries also deploy the latest main.
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - name: Build Modeling App and its workspace dependencies
        run: pnpm build --filter=@dhis2-chap/modeling-app...

      - name: Deploy Modeling App
        working-directory: apps/modeling-app
        env:
          DHIS2_BASE_URL: ${{ secrets.CLIMATE_DEMO_DEV_URL }}
          D2_USERNAME: ${{ secrets.CLIMATE_DEMO_DEV_USERNAME }}
          D2_PASSWORD: ${{ secrets.CLIMATE_DEMO_DEV_PASSWORD }}
        # d2-app-scripts deploy cannot upload bundles over 10 MiB.
        run: |
            bundle=$(ls build/bundle/*.zip)
            status=$(curl -sS -o response.txt -w '%{http_code}' \
                -u "$D2_USERNAME:$D2_PASSWORD" \
                -F "file=@$bundle" "${DHIS2_BASE_URL%/}/api/apps")
            if [[ "$status" != 2* ]]; then
                echo "Upload failed with HTTP $status"
                cat response.txt
                exit 1
            fi
