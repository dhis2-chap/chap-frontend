# TODO: This workflow builds chap-core images from source as a workaround because
# no pre-built version-tagged Docker images are published on GHCR. Once chap-core
# ships with pre-built and published versioned images, remove the clone + build
# steps and pull the published images directly instead.
name: e2e-stable

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CHAP_CORE_STABLE_REF: v2.3.0

jobs:
    e2e-stable:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read
            packages: read

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  check-latest: true
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            # The chap-core images are built from source below and can exhaust the
            # runner's disk, so remove preinstalled toolchains this job never uses.
            - name: Free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  docker system prune -af
                  df -h /

            - name: Clone chap-core at stable release
              run: |
                  git clone --depth 1 --branch "$CHAP_CORE_STABLE_REF" \
                    https://github.com/dhis2-chap/chap-core.git /tmp/chap-core

            - name: Build stable chap-core image
              run: |
                  docker build \
                    -t ghcr.io/dhis2-chap/chap-core:${{ env.CHAP_CORE_STABLE_REF }} \
                    -f /tmp/chap-core/Dockerfile \
                    /tmp/chap-core

            # Dockerfile.worker builds on the private ghcr.io/dhis2-chap/chap-worker-with-inla image.
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build stable chap-worker image
              run: |
                  docker build \
                    -t ghcr.io/dhis2-chap/chap-worker:${{ env.CHAP_CORE_STABLE_REF }} \
                    -f /tmp/chap-core/Dockerfile.worker \
                    /tmp/chap-core

            - name: Start CHAP + DHIS2 stack and wait for readiness
              env:
                  CHAP_CORE_TAG: ${{ env.CHAP_CORE_STABLE_REF }}
                  CHAP_WORKER_TAG: ${{ env.CHAP_CORE_STABLE_REF }}
              run: pnpm docker:e2e up --wait

            - name: Run e2e tests
              run: pnpm e2e:ci

            - name: Show stack status and logs
              if: ${{ failure() }}
              run: |
                  pnpm docker:e2e ps --all || true
                  docker compose --project-name chap-platform \
                    -f docker/compose.chap.yml -f docker/compose.dhis2.yml \
                    logs --no-color --tail 200 || true

            - name: Upload Playwright artifacts
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-stable
                  path: |
                      test-results/
                  retention-days: 7
