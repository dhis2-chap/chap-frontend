# Pinned deliberately: a failure here should mean "this branch broke", not "the backend
# moved". Bump CHAP_CORE_STABLE_REF as its own reviewed change.
name: e2e-stable

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CHAP_CORE_STABLE_REF: v2.0.0

jobs:
    e2e-stable:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'pnpm'
                  cache-dependency-path: 'pnpm-lock.yaml'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Start CHAP + DHIS2 stack and wait for readiness
              env:
                  CHAP_CORE_TAG: ${{ env.CHAP_CORE_STABLE_REF }}
                  CHAP_WORKER_TAG: ${{ env.CHAP_CORE_STABLE_REF }}
              run: pnpm docker:e2e up --wait --pull always

            - name: Run e2e tests
              run: pnpm e2e:ci

            - name: Upload Playwright artifacts
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-stable
                  path: |
                      test-results/
                  retention-days: 7
