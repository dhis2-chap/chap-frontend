name: test-and-release

on:
  push:
    branches-ignore:
      # Changesets uses temporary branches when creating signed release commits.
      - 'changesets-ghcommit-temp/**'
    # Preserve the existing behavior for tag pushes.
    tags:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel previous runs if not on main
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/main"]'), github.ref) }}

jobs:
  install:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install
        run: pnpm install --frozen-lockfile

  lint:
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - run: pnpm linter:check

  test:
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm build

      - name: Save Modeling App bundle for the latest build
        if: github.ref == 'refs/heads/main' && !github.event.repository.fork
        uses: actions/upload-artifact@v4
        with:
          name: modeling-app-latest
          path: apps/modeling-app/build/bundle/*.zip
          if-no-files-found: error
          retention-days: 1


  typescript:
    runs-on: ubuntu-latest
    needs: [install, build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm build

      - run: pnpm tsc:check

  latest:
    needs: [lint, test, typescript, build]
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modeling-app-latest

      - name: Publish latest Modeling App build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
            # A retried old run must not replace a newer build.
            if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
                echo "Skipping: $GITHUB_SHA is no longer the head of main."
                exit 0
            fi
            mv ./*.zip modeling-app-latest.zip
            title='Latest main build (unstable)'
            notes="Unstable build of $GITHUB_SHA. Use a versioned release for production."
            if gh release view latest > /dev/null 2>&1; then
                gh release upload latest modeling-app-latest.zip --clobber
                gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
                gh release edit latest --title "$title" --notes "$notes" --prerelease --latest=false
            else
                gh release create latest modeling-app-latest.zip --target "$GITHUB_SHA" \
                    --title "$title" --notes "$notes" --prerelease --latest=false
            fi

  release:
    needs: [lint, test, typescript, build]
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:publish
          commit: "chore(release): version packages [skip release]"
          title: "chore(release): version packages"
          createGithubReleases: false
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
          D2_APP_HUB_TOKEN: ${{ secrets.DHIS2_BOT_APPHUB_TOKEN }}
